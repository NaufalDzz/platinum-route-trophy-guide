<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platinum Route — GTA VI Trophy Guide &amp; Tracker</title>
<meta name="description" content="Offline GTA VI PS5 trophy guide and tracker: all 55 official trophies, a cited platinum roadmap, missable windows and saved progress.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/views.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<header id="app-header">
  <div class="brand">
    <img class="brand-mark" src="favicon.svg" alt="" width="34" height="34">
    <div class="brand-text">
      <h1 class="brand-title">Platinum Route</h1>
      <p class="brand-sub">GTA VI · PS5 trophy guide &amp; tracker</p>
    </div>
  </div>
  <div id="header-progress" aria-live="polite"></div>
  <div class="header-actions">
    <label class="spoiler-switch" for="spoiler-toggle">
      <input type="checkbox" id="spoiler-toggle">
      <span class="switch-track" aria-hidden="true"></span>
      <span class="switch-label">Spoiler Shield</span>
    </label>
    <button type="button" id="export-btn" class="btn btn-light">Export JSON</button>
    <button type="button" id="import-btn" class="btn btn-light">Import JSON</button>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <button type="button" id="reset-btn" class="btn btn-ghost" title="Clear all saved progress">Reset</button>
    <span id="save-state" class="save-state">Saved in this browser</span>
  </div>
</header>
<section id="audit-strip" aria-label="Data audit, computed from the app's data files"></section>
<nav id="nav-tabs" aria-label="Views">
  <button type="button" class="tab" data-view="tracker">Tracker</button>
  <button type="button" class="tab" data-view="roadmap">Platinum Roadmap</button>
  <button type="button" class="tab" data-view="missables">Missables &amp; Timeline</button>
  <button type="button" class="tab" data-view="sources">Sources, Audit &amp; Backup</button>
  <span class="tab-hint"><kbd>/</kbd> search · <kbd>j</kbd> <kbd>k</kbd> move · <kbd>x</kbd> earned</span>
  <input type="search" id="search-input" placeholder="Search trophies, missions, tips…" aria-label="Search trophies" autocomplete="off">
</nav>
<main id="views">
  <section id="tracker-view" class="view" aria-label="Trophy tracker">
    <div id="filter-bar">
      <div id="filter-chips" role="toolbar" aria-label="Filters"></div>
    </div>
    <div class="tracker-grid">
      <ol id="trophy-list" aria-label="Trophies"></ol>
      <article id="trophy-detail" aria-live="polite"></article>
      <aside id="next-up-panel"></aside>
    </div>
  </section>
  <section id="roadmap-view" class="view" aria-label="Platinum roadmap" hidden></section>
  <section id="missables-view" class="view" aria-label="Missables and points of no return" hidden></section>
  <section id="sources-view" class="view" aria-label="Sources, audit and backup" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
